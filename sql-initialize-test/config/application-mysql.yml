# Spring Boot MySQL数据源配置
spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_HOST:3306}/init_demo?serverTimezone=GMT%2B8"
    username: "${MYSQL_USER:root}"
    password: "${MYSQL_PASSWORD:dev-2333}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

# MyBatis XML位置
mybatis:
  mapper-locations: "classpath:/mapper/mysql/*.xml"

# sql-initialize配置
io:
  github:
    swsk33:
      sql-init:
        # 是否启用数据库初始化检查
        enabled: true
        # 数据库检查选项
        database-check:
          # 是否检查数据库是否存在
          check-database: true
          # 若数据库不存在，则会依次执行下列SQL文件
          # file:开头表示本地文件路径，classpath:表示类路径/jar包内资源路径
          # sql-paths:
          #  - "classpath:setup-database.sql"
        # 数据表检查选项
        table-check:
          # 是否检查特定数据表是否存在
          check-table: true
          # 配置要检查的数据表列表
          table-list:
            # 检查用户表
            - table-name: "user"
              # 用户表不存在则执行下列用户表相关初始化脚本
              sql-paths:
                - "classpath:init-mysql/table/user.sql"
                - "classpath:init-mysql/data/user.sql"
            # 检查角色表
            - table-name: "role"
              # 角色表不存在则执行下列角色表相关初始化脚本
              sql-paths:
                - "classpath:init-mysql/table/role.sql"
                - "classpath:init-mysql/data/role.sql"